version: "3.1"

rules:
- rule: Greet user dynamically in their language
  steps:
  - intent: greet
  - action: action_multilingual_greet

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Provide service overview when asked
  steps:
  - intent: ask_services
  - action: action_langchain_fallback

- rule: Answer pricing queries via LangChain RAG
  steps:
  - intent: ask_pricing
  - action: action_langchain_fallback

- rule: Route out-of-scope or unhandled queries to LangChain Multilingual Fallback
  steps:
  - intent: nlu_fallback
  - action: action_langchain_fallback

- rule: Activate appointment form
  steps:
  - intent: book_appointment
  - action: appointment_form
  - active_loop: appointment_form

- rule: Submit appointment form
  condition:
  - active_loop: appointment_form
  steps:
  - action: appointment_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_booking_confirmed
