# Configuration for Rasa NLU and Core.
# https://rasa.com/docs/rasa/model-configuration/

recipe: default.v1
assistant_id: multilingual_assistant_v1
language: en

pipeline:
# Tokenization & Regex Featurization
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

# Dual Intent and Entity Transformer
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true

  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true

# Fallback Classifier triggers when confidence is below 0.65
# Automatically delegates to action_langchain_fallback
  - name: FallbackClassifier
    threshold: 0.65
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_langchain_fallback"
    enable_fallback_prediction: true
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
